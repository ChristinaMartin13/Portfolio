<!DOCTYPE html> <!--Always at the top, declares that the document is using HTML 5-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">  <!--Root element of webpage. Wraps everything on page. Tells browsers the content is english, and using thymeleaf.-->
<head> <!--Information about the page. Doesn't show up on the page.-->
    <meta charset="UTF-8"> <!--Tells the browser what character encoding to use.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Makes webpage responsive, adapts to the layout of all screen sizes.-->
    <title>Christina Martin - Portfolio</title> <!--Sets title shown in browser tab.-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"> <!--Add Bootstrap CSS-->
</head>
<body> <!--Everything inside the body appears on the page.-->
<div class="container">
    <div th:replace="~{index :: content}"></div> <!--Thymeleaf inserts content from other html files.-->
</div>
<script src="https://unpkg.com/htmx.org@1.7.0"></script> <!--Add htmx.-->
<script src="https://cdn.jsdelivr.net/npm/alpinejs@2.8.2/dist/alpine.min.js" defer></script> <!--Add Alpine.js-->
</body>
</html>
